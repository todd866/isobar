name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test tools
        timeout-minutes: 4
        run: |
          # ffmpeg's recommends pull pocketsphinx-en-us (~27 MB) and stalled the
          # first 1.9 run until the job was cancelled. The encoder is a dependency.
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --disable-pip-version-check pytest pytest-timeout pillow
      - name: Run Python unit tests
        timeout-minutes: 6
        env:
          ISOBAR_PYTEST_TIMEOUT: "90"
        run: python3 tools/run-python-tests.py Tests 'test_*.py'
      - name: Run wall tests
        timeout-minutes: 6
        run: python3 -m pytest wall -q --timeout=90 --timeout-method=signal
