<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isobar wall</title><style>
:root{color-scheme:light;--paper:#f6f7f3;--ink:#18201f;--muted:#66716d;--line:#d3d9d5;--blue:#1672a5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:clamp(14px,1.35vw,18px)/1.35 system-ui,-apple-system,sans-serif}.wall{min-height:100dvh;max-width:1680px;margin:auto;padding:clamp(12px,2vw,28px) clamp(16px,3vw,48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(8px,1.2vw,18px)}header{display:flex;justify-content:space-between;align-items:baseline}h1{font-size:clamp(1.1rem,2.4vw,2rem);letter-spacing:.06em;margin:0}.date{color:var(--muted);font-size:.88em}.stage{position:relative;min-height:0;background:#e8ece9;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center}video{display:block;width:100%;height:100%;object-fit:contain;background:var(--paper)}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--paper);z-index:1}.stage.ready img{display:none}.message{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 10px;border-radius:999px;background:#fffffff0;color:var(--muted);font-size:.8em;white-space:nowrap}.message:empty{display:none}.source{display:flex;justify-content:space-between;color:var(--muted);font-size:.72em}.controls{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:9px}.controls button{border:1px solid var(--line);border-radius:999px;background:transparent;color:inherit;padding:7px 13px;cursor:pointer;font:inherit;font-size:.85em}.controls input{width:100%;accent-color:var(--blue)}.time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0;background:#ffffff80}.card h2{font-size:.76em;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 3px}.reading{font-size:clamp(1rem,2vw,1.4rem);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:.73em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{display:inline-block;font-size:1.1em;margin-right:5px;color:var(--blue)}button:focus-visible,input:focus-visible{outline:3px solid #4c8dcc;outline-offset:2px}@media(max-width:620px){.wall{padding:10px;gap:8px}.controls{grid-template-columns:auto minmax(0,1fr) auto}.time{grid-column:1/-1;justify-self:end}.cards{gap:6px}.card{padding:8px}}@media(max-height:500px){.wall{gap:5px;padding:8px 14px}.cards{gap:5px}.card{padding:6px 8px}.card h2{margin-bottom:1px}.sub{font-size:.68em}}
</style><style>(max-height:650px){.wall{height:100dvh;min-height:0;grid-template-rows:auto minmax(100px,1fr) auto auto}.stage{height:100%;min-height:140px;max-height:calc(100dvh - 250px)}video{min-height:0;min-width:0}}</style></head><body><main class="wall"><header><h1>ISOBAR · PERTH COAST</h1><div class="date" id="date">Preparing…</div></header><section class="stage" aria-label="Bureau synoptic forecast map"><video id="fronts" muted playsinline preload="metadata" aria-label="Animated Bureau synoptic forecast"></video><img id="poster" alt="Latest Bureau synoptic forecast map"><div class="message" id="message" role="status"></div></section><div class="source"><span id="caption">Bureau prognosis</span><span id="updated"></span></div><div class="controls" aria-label="Forecast controls"><button id="play" type="button" disabled>Play</button><input id="scrub" type="range" min="0" max="15" step="0.0416667" value="0" disabled aria-label="Forecast time"><span class="time" id="time">Preparing…</span><button id="retry" type="button" hidden>Retry</button></div><section class="cards" aria-label="Current conditions"><article class="card"><h2>Rain</h2><div class="reading" id="rain">Missing</div><div class="sub" id="rainSub"></div></article><article class="card"><h2>Wind</h2><div class="reading"><span class="arrow" id="windArrow" aria-hidden="true">↑</span><span id="wind">Missing</span></div><div class="sub" id="windSub"></div></article><article class="card"><h2>Surf</h2><div class="reading" id="surf">Missing</div><div class="sub" id="surfSub"></div></article></section></main>
<script>
(()=>{const v=document.querySelector('#fronts'),poster=document.querySelector('#poster'),play=document.querySelector('#play'),retry=document.querySelector('#retry'),range=document.querySelector('#scrub'),time=document.querySelector('#time'),message=document.querySelector('#message'),caption=document.querySelector('#caption'),stage=document.querySelector('.stage'),updated=document.querySelector('#updated');const limit=50*1024*1024;let active=null,loading=null,abort=null,disposed=false;
const finite=x=>typeof x==='number'&&Number.isFinite(x);const fmt=x=>{const d=new Date(x);return Number.isNaN(d.valueOf())?'':new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(d)};
function status(s){message.textContent=s||''}function show(s){const keys=active?.meta?.keyframes||[];let i=0;for(let j=0;j<keys.length;j++)if(Number(keys[j].seconds)<=s)i=j;const key=keys[i];time.textContent=key?.validTime?fmt(key.validTime):(key?.label||'Forecast');range.value=Math.min(+range.max||0,Math.max(0,s));const next=keys[i+1];caption.textContent=key&&next?`Bureau prognosis · ${fmt(key.validTime)}–${fmt(next.validTime)}`:'Bureau prognosis'}
function conditions(c){const r=c.rain||{},w=c.wind||{},s=c.surf||{};const text=v=>typeof v==='string'&&v&&v!=='—'?v:'';const windDir=text(w.compass)||text(w.from);const surfDir=text(s.compass)||text(s.from);document.querySelector('#rain').textContent=finite(r.mm)?(r.mm<.1&&r.mm>0?'<0.1':r.mm.toFixed(1))+' mm':finite(r.knownMm)?r.knownMm.toFixed(1)+' mm known':'Missing';document.querySelector('#rainSub').textContent=finite(r.knownMm)&&r.coveredHours<r.hours?r.coveredHours+'h covered':'next 12h';document.querySelector('#wind').textContent=finite(w.kt)?Math.round(w.kt)+' kt':'Missing';document.querySelector('#windSub').textContent=windDir?'from '+windDir:'';const ar=document.querySelector('#windArrow');ar.style.display=finite(w.kt)?'inline-block':'none';ar.style.transform=`rotate(${finite(w.from)?w.from+180:0}deg)`;document.querySelector('#surf').textContent=finite(s.metres)?s.metres.toFixed(1)+' m':'Missing';document.querySelector('#surfSub').textContent=finite(s.period)?Math.round(s.period)+' s'+(surfDir?' · '+surfDir:''):(surfDir||'')}
async function fetchBytes(url,signal){const res=await fetch(url,{signal,cache:'force-cache'});if(!res.ok||!res.body)throw Error('video');const reader=res.body.getReader();const parts=[];let total=0;try{for(;;){const part=await reader.read();if(part.done)break;total+=part.value.byteLength;if(total>limit)throw Error('video too large');parts.push(part.value)}return new Blob(parts,{type:'video/mp4'})}finally{reader.releaseLock()}}
function decode(url,signal){return new Promise((resolve,reject)=>{const candidate=document.createElement('video');candidate.muted=true;candidate.playsInline=true;candidate.preload='metadata';const done=()=>{cleanup();resolve(candidate)},fail=()=>{cleanup();reject(Error('video decode'))},cleanup=()=>{candidate.removeEventListener('loadeddata',done);candidate.removeEventListener('error',fail);signal.removeEventListener('abort',cancel)},cancel=()=>{cleanup();candidate.removeAttribute('src');candidate.load();reject(Object.assign(Error('aborted'),{name:'AbortError'}))};signal.addEventListener('abort',cancel,{once:true});candidate.addEventListener('loadeddata',done,{once:true});candidate.addEventListener('error',fail,{once:true});candidate.src=url;candidate.load()})}
async function loadGeneration(pointer,signal){const base=new URL('.',location.href),videoUrl=new URL(pointer.video,base).href,metaUrl=new URL(pointer.metadata,base).href;const meta=await fetch(metaUrl,{signal,cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('metadata');return r.json()});const blob=await fetchBytes(videoUrl,signal);const url=URL.createObjectURL(blob);try{await decode(url,signal);return {generation:pointer.generation,meta,videoUrl,url}}catch(e){URL.revokeObjectURL(url);throw e}}
async function refresh(){if(disposed||loading)return;const controller=new AbortController();abort=controller;loading=(async()=>{try{const pointer=await fetch('/current.json',{signal:controller.signal,cache:'no-store'}).then(r=>{if(!r.ok)throw Error('current');return r.json()});document.querySelector('#date').textContent='Perth coast';if(pointer.updatedAt)updated.textContent='Updated '+fmt(pointer.updatedAt);conditions(pointer.conditions||{});if(active?.generation===pointer.generation){status('');retry.hidden=true;return}status('Preparing forecast…');const next=await loadGeneration(pointer,controller.signal);if(disposed){URL.revokeObjectURL(next.url);return}const old=active,oldSrc=v.currentSrc||v.src,oldTime=v.currentTime;try{v.pause();v.src=next.url;v.load();await new Promise((resolve,reject)=>{const ok=()=>{v.removeEventListener('loadeddata',ok);v.removeEventListener('error',bad);resolve()};const bad=()=>{v.removeEventListener('loadeddata',ok);v.removeEventListener('error',bad);reject(Error('video swap'))};v.addEventListener('loadeddata',ok,{once:true});v.addEventListener('error',bad,{once:true})})}catch(e){v.src=oldSrc;v.load();if(old)try{v.currentTime=oldTime}catch{};URL.revokeObjectURL(next.url);throw e}active={...next,pointer};range.max=String(next.meta.durationSeconds||15);range.disabled=false;play.disabled=false;stage.classList.add('ready');if(pointer.poster)poster.src=new URL(pointer.poster,location.href);show(0);status('');retry.hidden=true;if(old)URL.revokeObjectURL(old.url)}catch(e){if(e.name!=='AbortError'){status(active?'Forecast refresh unavailable':'Could not prepare forecast');retry.hidden=false}}finally{loading=null;if(abort===controller)abort=null}})();await loading}
play.onclick=()=>{if(!active)return;v.paused?v.play().catch(()=>{}):v.pause()};v.onplay=()=>{play.textContent='Pause';v.loop=true};v.onpause=()=>play.textContent='Play';v.ontimeupdate=()=>show(v.currentTime);range.oninput=()=>{if(active){v.pause();v.currentTime=+range.value;show(v.currentTime)}};retry.onclick=()=>refresh();document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();else{disposed=false;refresh()}});addEventListener('pageshow',()=>{disposed=false;refresh()});addEventListener('pagehide',()=>{disposed=true;abort?.abort();v.pause();if(active?.url)URL.revokeObjectURL(active.url)});refresh();setInterval(()=>refresh(),900000)})();
</script></body></html>
