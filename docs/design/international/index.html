<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isobar · places</title>
<style>
:root{font-size:16px;--ink:#193a40;--muted:#627b7f;--paper:#f5f3ee;--ocean:#bed8dc;--land:#e7e5d5;--line:#cdd8d6;--accent:#166674}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.35 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:.65rem;background:#ffffffb3;min-height:44px;padding:.45rem .8rem}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}
.shell{height:100dvh;min-height:28rem;max-width:1600px;margin:auto;padding:1rem 1.5rem .5rem;display:grid;grid-template-rows:auto auto auto minmax(110px,1fr) auto;gap:.6rem}header{display:flex;align-items:center;gap:.75rem;min-width:0}.wordmark{font-weight:800;font-size:1.35rem;letter-spacing:-.06em;margin:0 auto 0 0}.place-button{text-align:left;display:grid;font-weight:650;line-height:1.15}.place-button small{font-size:.7rem;color:var(--muted);font-weight:450;margin-top:.15rem}.units-wrap{position:relative}.units-panel{position:absolute;top:calc(100% + .5rem);right:0;z-index:10;width:min(22rem,calc(100vw - 2rem));padding:1rem;border:1px solid var(--line);border-radius:1rem;background:var(--paper);box-shadow:0 12px 40px #173c4026}.units-panel label{display:flex;justify-content:space-between;align-items:center;gap:.75rem;font-size:.9rem;margin:.5rem 0}.units-panel select{min-height:36px;border:1px solid var(--line);background:white;border-radius:.4rem;padding:.25rem .4rem;min-width:5rem}
.quick-places{display:flex;gap:.5rem;min-width:0;overflow-x:auto;padding:.2rem}.quick-place{display:flex;gap:.65rem;align-items:center;white-space:nowrap;font-size:.85rem}.quick-place time{font-variant-numeric:tabular-nums;opacity:.75}.readings{display:flex;align-items:center;gap:1rem;min-width:0}.temperature{font-size:2.7rem;font-weight:700;letter-spacing:-.065em;line-height:1;white-space:nowrap}.temperature small{font-size:1.1rem;letter-spacing:0}.weather-summary{font-size:.95rem}.local-time{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.map-wrap{position:relative;min-height:0;border-radius:1rem;background:var(--ocean);overflow:hidden}.map-wrap canvas{position:absolute;inset:0;width:100%;height:100%}.map-button{position:absolute;inset:0;border:0;background:transparent;border-radius:1rem}.map-button:focus-visible{outline-offset:-5px}.prototype-badge{position:absolute;right:.6rem;top:.6rem;pointer-events:none;font-size:.65rem;padding:.3rem .55rem;border-radius:.4rem;background:#f7faf4e8;color:var(--muted)}.map-layers{position:absolute;bottom:.6rem;left:.6rem;display:flex;gap:.4rem}.map-layers button{font-size:.75rem;box-shadow:0 2px 8px #193a4010;background:#f8faf6ed}.map-layers button[aria-pressed=true]{background:var(--accent)}
.transport{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.7rem}.transport>button{border:0;background:transparent;font-size:.9rem;font-weight:650}.timeline{min-height:80px;display:grid;grid-template-rows:auto 44px auto;gap:4px;position:relative;cursor:ew-resize;touch-action:pan-y}.timeline input{display:block;width:100%;height:44px;margin:0;accent-color:var(--accent)}.timeline-scale{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);pointer-events:none}.time-label{display:block;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
dialog{width:min(450px,calc(100vw - 1.5rem));max-height:90dvh;padding:1.1rem;border:1px solid var(--line);border-radius:1rem;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#193a4060}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}.dialog-head h2{font-size:1.1rem;margin:0}.close{border:0;background:none;font-size:1.5rem;min-width:44px}.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:.5rem;background:white;padding:.7rem;margin:.6rem 0}.place-results{max-height:50dvh;overflow-y:auto;display:grid;gap:.25rem}.place-result{text-align:left;border:0;background:transparent}.place-result:hover{background:#dfebea}.place-result strong,.place-result small{display:block}.place-result small{font-size:.75rem;color:var(--muted)}.empty-results{font-size:.9rem;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:600px){.shell{padding:.65rem .7rem .35rem;gap:.5rem}.wordmark{font-size:1.2rem}.place-button{max-width:55vw;padding:.4rem .5rem}.place-button small{max-width:11rem;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.readings{gap:.65rem}.temperature{font-size:2.3rem}.weather-summary{font-size:.85rem}.transport{gap:.2rem;grid-template-columns:1fr 1fr}.timeline{grid-column:1/-1;grid-row:1}.transport>button:first-child{justify-self:start}.transport>button:last-child{justify-self:end}.transport>button{padding:.3rem}.quick-place{padding:.4rem .6rem}.timeline-scale{font-size:.6rem}.timeline-scale span:nth-child(2),.timeline-scale span:nth-child(3){display:none}.prototype-badge{font-size:.6rem}}
@media(max-height:500px) and (min-width:600px){.shell{min-height:22rem;padding:.45rem .8rem;gap:.3rem;grid-template-columns:auto 1fr;grid-template-rows:auto auto minmax(100px,1fr) auto}header{grid-column:1/-1}.quick-places{grid-row:2;grid-column:2;justify-content:flex-end}.readings{grid-row:2;grid-column:1}.temperature{font-size:2rem}.local-time{display:none}.map-wrap,.transport{grid-column:1/-1}}
.shell>*{min-width:0}header{flex-wrap:wrap}.units-panel label{flex-wrap:wrap}.units-panel select{max-width:100%}.units-wrap{margin-left:auto}
</style></head><body>
<main class="shell">
<header><h1 class="wordmark">isobar</h1><button id="place-button" class="place-button" type="button"><span id="place-name">Perth coast</span><small id="place-subtitle">Australia</small></button><div class="units-wrap"><button id="units-button" type="button" aria-expanded="false" aria-controls="units-panel">Units</button><div id="units-panel" class="units-panel" hidden><label>Temperature<select id="temp-units"><option value="C">°C</option><option value="F">°F</option></select></label><label>Rain<select id="rain-units"><option value="mm">mm</option><option value="in">in</option></select></label><label>Wind<select id="wind-units"><option value="kt">kt</option><option value="mph">mph</option><option value="kmh">km/h</option></select></label></div></div></header>
<nav id="quick-places" class="quick-places" aria-label="Pinned places"></nav>
<section class="readings" aria-label="Example weather"><div id="temperature" class="temperature"></div><div><div id="weather-summary" class="weather-summary"></div><div id="local-time" class="local-time"></div></div></section>
<section class="map-wrap" aria-label="Regional map"><canvas id="map" role="img"></canvas><button id="map-button" class="map-button" aria-label="Return to now and resume playback" type="button"></button><span class="prototype-badge">UX prototype · example weather</span><div class="map-layers"><button type="button" data-layer="rain" aria-pressed="false">Rain</button><button type="button" data-layer="temperature" aria-pressed="false">Temperature</button></div></section>
<section class="transport" aria-label="Forecast time"><button id="play-button" type="button" aria-pressed="false">▶ Play</button><div class="timeline"><div id="timeline-scale" class="timeline-scale"></div><input id="time-slider" type="range" min="0" max="24" step="0.001" value="0" aria-label="Forecast time"><output id="time-label" class="time-label" for="time-slider"></output></div><button id="now-button" type="button">Now</button></section>
</main>
<dialog id="place-dialog" aria-labelledby="place-dialog-title"><div class="dialog-head"><h2 id="place-dialog-title">Places</h2><button id="place-close" class="close" type="button" aria-label="Close">×</button></div><button id="pin-button" type="button">Pin this place</button><label class="sr-only" for="place-search">Search city or region</label><input id="place-search" class="search" type="search" placeholder="Search city or region" autocomplete="off"><div id="place-results" class="place-results"></div></dialog>
<script src="land.js"></script><script>
(()=>{
    const cities=[
      {id:'perth',name:'Perth coast',region:'Western Australia',country:'Australia',tz:'Australia/Perth',lat:-31.95,lon:115.82,temp:16,rain:0.7,wind:7,dir:'N',at:21,window:'9–11 pm'},
      {id:'london-uk',name:'London',region:'England',country:'United Kingdom',tz:'Europe/London',lat:51.51,lon:-.13,temp:13,rain:2.4,wind:9,dir:'SW',at:18,window:'6–8 pm'},
      {id:'london-ca',name:'London',region:'Ontario',country:'Canada',tz:'America/Toronto',lat:42.98,lon:-81.25,temp:19,rain:0.2,wind:6,dir:'W',at:23,window:'11 pm–1 am'},
      {id:'new-york',name:'New York',region:'New York',country:'United States',tz:'America/New_York',lat:40.71,lon:-74.01,temp:22,rain:3.8,wind:11,dir:'S',at:16,window:'4–7 pm'},
      {id:'tokyo',name:'Tokyo',region:'Kanto',country:'Japan',tz:'Asia/Tokyo',lat:35.68,lon:139.69,temp:26,rain:4.1,wind:8,dir:'E',at:10,window:'10 am–noon'},
      {id:'auckland',name:'Auckland',region:'North Island',country:'New Zealand',tz:'Pacific/Auckland',lat:-36.85,lon:174.76,temp:18,rain:1.1,wind:14,dir:'SW',at:14,window:'2–4 pm'}
    ];

const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),base=Date.UTC(2026,8,28,0);
function read(key,fallback){try{return JSON.parse(localStorage.getItem('isobar.study.'+key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem('isobar.study.'+key,JSON.stringify(value))}catch{}}
let city=cities.find(c=>c.id===read('city','perth'))||cities[0],frame=0,playing=false,raf=0,last=0;
let units=read('units',{});if(!units||typeof units!=='object')units={};
for(const [key,values] of Object.entries({temp:['C','F'],rain:['mm','in'],wind:['kt','mph','kmh']}))if(!values.includes(units[key]))units[key]=values[0];
let pins=read('pins',['perth','tokyo']);if(!Array.isArray(pins))pins=['perth','tokyo'];pins=[...new Set(pins)].filter(id=>cities.some(c=>c.id===id));
const layers={rain:false,temperature:false};
const instant=()=>new Date(base+frame*3600000);
const time=(date,place=city,day=false)=>new Intl.DateTimeFormat(undefined,{...(day?{weekday:'short'}:{}),hour:'2-digit',minute:'2-digit',timeZone:place.tz,...(day?{timeZoneName:'short'}:{})}).format(date);
function quickPlaces(){const nav=$('quick-places');nav.replaceChildren(...pins.map(id=>{const p=cities.find(c=>c.id===id),b=document.createElement('button');b.type='button';b.className='quick-place';b.dataset.place=id;b.setAttribute('aria-pressed',String(id===city.id));b.append(document.createTextNode(p.name));const clock=document.createElement('time');clock.textContent=time(instant(),p);b.append(clock);b.title=p.region+', '+p.country;b.addEventListener('click',()=>choose(p));return b}));}
const merc=lat=>Math.log(Math.tan(Math.PI/4+Math.max(-80,Math.min(80,lat))*Math.PI/360))*180/Math.PI;
function draw(){const r=canvas.getBoundingClientRect(),w=r.width,h=r.height,d=devicePixelRatio||1;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#bed8dc';ctx.fillRect(0,0,w,h);const scale=Math.min(w/80,h/52),project=(lon,lat)=>[w*.51+(lon-city.lon)*scale,h*.52-(merc(lat)-merc(city.lat))*scale];
 ctx.fillStyle='#e7e5d5';ctx.strokeStyle='#9cafaa';ctx.lineWidth=.8;for(const feature of window.ISOBAR_LAND||[]){const polygons=feature.type==='MultiPolygon'?feature.coordinates:[feature.coordinates];for(const polygon of polygons)for(const shift of [-360,0,360]){ctx.beginPath();for(const ring of polygon){ring.forEach(([lon,lat],i)=>{const [x,y]=project(lon+shift,lat);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}ctx.fill('evenodd');ctx.stroke()}}
 if(layers.temperature){const grad=ctx.createLinearGradient(0,h,0,0);grad.addColorStop(0,'#e99b5e66');grad.addColorStop(.5,'#edcd8950');grad.addColorStop(1,'#718cb366');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h)}
 if(layers.rain){const x=w*(.2+frame/24*.5),y=h*.45,g=ctx.createRadialGradient(x,y,1,x,y,Math.max(w,h)*.28);g.addColorStop(0,'#168eb590');g.addColorStop(1,'#168eb500');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
 const [x,y]=project(city.lon,city.lat);ctx.fillStyle='#166674';ctx.beginPath();ctx.arc(x,y,5,0,2*Math.PI);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.font='600 13px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#f5f3ee';ctx.strokeText(city.name,x+11,y-8);ctx.fillText(city.name,x+11,y-8);
}
function render(){const temp=city.temp+Math.sin(frame/24*Math.PI*2)*2,tempValue=Math.round(units.temp==='F'?temp*9/5+32:temp),rain=units.rain==='in'?(city.rain/25.4).toFixed(2):city.rain.toFixed(1),speed=Math.round(city.wind*(units.wind==='mph'?1.15078:units.wind==='kmh'?1.852:1));
 $('temperature').innerHTML=tempValue+'°<small>'+units.temp+'</small>';
 const rainText=frame<8?'Rain '+time(new Date(base+3*3600000))+'–'+time(new Date(base+8*3600000))+' · '+rain+' '+units.rain: 'Dry next 12h';
 $('weather-summary').textContent=rainText+' · '+city.dir+' '+speed+' '+(units.wind==='kmh'?'km/h':units.wind);
 $('local-time').textContent=city.name+' · '+time(instant(),city,true);$('place-name').textContent=city.name;$('place-subtitle').textContent=city.region+' · '+city.country;
 $('time-slider').value=frame;$('time-label').textContent=(frame<.001?'Now · ':'')+time(instant(),city,true);$('time-slider').setAttribute('aria-valuetext',time(instant(),city,true));
 $('timeline-scale').replaceChildren(...[0,8,16,24].map(h=>{const s=document.createElement('span');s.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:city.tz}).format(new Date(base+h*3600000));return s}));
 for(const b of $('quick-places').children){b.setAttribute('aria-pressed',String(b.dataset.place===city.id));b.querySelector('time').textContent=time(instant(),cities.find(c=>c.id===b.dataset.place))}
 $('pin-button').textContent=(pins.includes(city.id)?'Unpin ':'Pin ')+city.name;canvas.setAttribute('aria-label','Example regional view around '+city.name);draw();
}
function choose(next){city=next;save('city',city.id);render()}
function setFrame(n){frame=Math.max(0,Math.min(24,Number(n)||0));render()}
function stop(){playing=false;cancelAnimationFrame(raf);raf=0;last=0;$('play-button').textContent='▶ Play';$('play-button').setAttribute('aria-pressed','false')}
function tick(t){if(!playing)return;if(last)setFrame((frame+(t-last)/1000*.2)%24);last=t;raf=requestAnimationFrame(tick)}
function play(){playing=true;last=0;$('play-button').textContent='Ⅱ Pause';$('play-button').setAttribute('aria-pressed','true');raf=requestAnimationFrame(tick)}
function now(){stop();setFrame(0);play()}
function results(){const q=$('place-search').value.trim().toLowerCase(),matches=cities.filter(c=>(c.name+' '+c.region+' '+c.country).toLowerCase().includes(q));$('place-results').replaceChildren(...matches.map(c=>{const b=document.createElement('button');b.className='place-result';b.type='button';const title=document.createElement('strong'),sub=document.createElement('small');title.textContent=c.name;sub.textContent=c.region+' · '+c.country;b.append(title,sub);b.addEventListener('click',()=>{choose(c);$('place-dialog').close()});return b}));if(!matches.length){const p=document.createElement('p');p.className='empty-results';p.textContent='No matching example place';$('place-results').append(p)}}
function closeUnits(){$('units-panel').hidden=true;$('units-button').setAttribute('aria-expanded','false')}
function openPlaces(){closeUnits();$('place-search').value='';results();$('place-dialog').showModal();$('place-search').focus()}
function pointerFrame(e){if(e.pointerType==='touch'&&!e.buttons)return;const r=document.querySelector('.timeline').getBoundingClientRect();stop();setFrame((e.clientX-r.left)/r.width*24)}
document.querySelector('.timeline').addEventListener('pointermove',pointerFrame);document.querySelector('.timeline').addEventListener('pointerdown',pointerFrame);
$('time-slider').addEventListener('input',e=>{stop();setFrame(e.target.value)});$('play-button').addEventListener('click',()=>playing?stop():play());$('now-button').addEventListener('click',now);$('map-button').addEventListener('click',now);
$('place-button').addEventListener('click',openPlaces);$('place-close').addEventListener('click',()=>$('place-dialog').close());$('place-dialog').addEventListener('close',()=>$('place-button').focus());$('place-search').addEventListener('input',results);
$('place-dialog').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('place-dialog').close();$('place-button').focus()}});
$('pin-button').addEventListener('click',()=>{pins=pins.includes(city.id)?pins.filter(id=>id!==city.id):[...pins,city.id];save('pins',pins);quickPlaces();render()});
$('units-button').addEventListener('click',()=>{const open=$('units-panel').hidden;$('units-panel').hidden=!open;$('units-button').setAttribute('aria-expanded',String(open));if(open)$('temp-units').focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('units-panel').hidden){closeUnits();$('units-button').focus();e.preventDefault()}});
for(const [id,key] of [['temp-units','temp'],['rain-units','rain'],['wind-units','wind']]){$(id).value=units[key];$(id).addEventListener('change',()=>{units[key]=$(id).value;save('units',units);render()})}
for(const b of document.querySelectorAll('[data-layer]'))b.addEventListener('click',()=>{const k=b.dataset.layer;layers[k]=!layers[k];b.setAttribute('aria-pressed',String(layers[k]));draw()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);new ResizeObserver(draw).observe(canvas);quickPlaces();render();
})();
</script></body></html>
